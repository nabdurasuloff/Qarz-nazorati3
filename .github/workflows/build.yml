name: Build Exe

on:
  push:
    branches: [ "main", "master", "asosiy" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install python-docx pandas openpyxl pyinstaller

    - name: Build EXE
      run: |
        pyinstaller --noconsole --onedir --name "qarz_nazorat" main.py

    - name: Copy Templates
      run: |
        if (Test-Path templates) { xcopy /E /I templates dist\qarz_nazorat\templates }
      shell: powershell

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: QarzNazorat-EXE
        path: dist/qarz_nazorat/

